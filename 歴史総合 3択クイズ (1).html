<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<title>歴史総合 3択クイズ</title>
<style>
:root{--a:#2150e0;--b:#7a35d6;--k:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--a:#0a1850;--b:#220d57}}
:root[data-theme=dark]{--a:#0a1850;--b:#220d57}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--a),var(--b)) fixed var(--a);color:#fff;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:30px;text-align:center;margin:26px 0 6px;color:#ffd84a;text-shadow:0 3px 0 #b8860b,0 0 18px #ffd84a88}
.sub{text-align:center;opacity:.85;margin:0 0 22px}
.btn{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:700;color:#fff;background:#e8a400;box-shadow:0 4px 0 #8a6000}
.btn.s{background:#3a4a90;box-shadow:0 4px 0 #1b2560}
.top{display:flex;justify-content:space-between;font-weight:700}
.bar{height:12px;border-radius:9px;background:var(--k);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:#4cd964}
.q{background:var(--k);border:2px solid #ffd84a;border-radius:16px;padding:18px;font-size:19px;line-height:1.6;min-height:110px;display:flex;align-items:center;font-weight:700}
.c{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0;padding:14px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:700;color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.c b{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#222;display:grid;place-items:center}
.c0{background:#e63946}.c1{background:#1d7be0}.c2{background:#2a9d4f}
.c.ok{background:#14b85a;outline:4px solid #ffd84a}
.c.ng{background:#555;text-decoration:line-through}
.res{text-align:center;font-size:26px;font-weight:900;margin:8px 0}
li{margin:8px 0;line-height:1.5}
</style></head><body>
<div id="app"></div>
<script>
const D=`19世紀後半、列強が植民地獲得を進めた動きは？|帝国主義|O

二月革命で退位した皇帝は？|ニコライ2世|P
二月革命で崩壊した王朝は？|ロマノフ朝||ハプスブルク朝,ホーエンツォレルン朝

社会主義者の評議会は？|ソヴィエト|O

革命当時のロシアの首都は？|ペトログラード||モスクワ,ウラジヴォストーク

十月革命が起こったのは何年？|1917年|Y
レーニンが世界革命を目指して設立した組織は？|コミンテルン|O

1920年、シベリアで日本人居留民や日本兵が殺害された事件は？|尼港事件|E
尼港事件後、日本が占領した地域は？|北樺太||南樺太,千島列島
第一次世界大戦後、アメリカは世界最大の何になった？|債権国||債務国,産油国
1920年代のアメリカで進んだ生産・消費の形は？|大量生産・大量消費|O
大量生産を可能にした代表的な生産方式は？|フォード方式|O
1920年、アメリカで保障された政治的権利は？|女性参政権|O
1924年、日本人移民を禁止した法律は？|移民法|T

1918年、ウィルソンが発表した戦後構想は？|十四カ条の平和原則|T
各民族が自らの政治的なあり方を決めるという考え方は？|民族自決|O
第一次世界大戦後に開かれた講和会議は？|パリ講和会議|T
パリ講和会議が開かれたのは何年？|1919年|Y

ヴェルサイユ条約でドイツに課された代表的なものは？|巨額の賠償金||軍備の増強,植民地の拡大

第一次世界大戦後につくられた国際平和機構は？|国際連盟||国際連合,コミンテルン
国際連盟の本部が置かれた都市は？|ジュネーヴ||ニューヨーク,ハーグ
国際連盟で重要事項を決める原則は？|全会一致||多数決,拒否権
国際連盟が侵略国に行えた制裁は？|経済制裁||軍事制裁,賠償金の請求
国際連盟が行えなかった制裁は？|軍事制裁||経済制裁,軍事同盟の締結
国際連盟を提唱しながら加盟しなかった国は？|アメリカ||イギリス,フランス
アジア・太平洋の国際秩序を話し合うために開かれた会議は？|ワシントン会議|T
ワシントン会議を開催した国は？|アメリカ||イギリス,日本
ワシントン会議で主力艦の保有量を制限した条約は？|ワシントン海軍軍縮条約|T

1919年、朝鮮で起こった独立運動は？|三・一独立運動|E
三・一独立運動の背景となった考え方は？|民族自決|O
1919年、中国で起こった反日・反帝国主義運動は？|五・四運動|E
日本と清が1871年に結んだ対等条約は？|日清修好条規|T
日清戦争で清が敗北 → 中国で何が進んだ？|列強による中国分割||清の領土拡大,列強の撤退

日露戦争後 → 日本が支配を強めた国は？|韓国||清,タイ
ソ連が1928年から導入した社会主義の経済体制は？|五か年計画||新経済政策／ネップ,ニューディール
ソ連が対ソ干渉戦争を乗り切るために採用した経済体制は？|新経済政策／ネップ||五か年計画,ニューディール
エジプトでフランス主導でつくられた運河は？|スエズ運河||パナマ運河,キール運河
日本が1871年に条約改正の予備交渉のため派遣した使節は？|岩倉使節団|O
1875年、日本とロシアが結んだ国境画定の条約は？|樺太・千島交換条約|T
中国の主権尊重を定めた条約は？|九カ国条約|T
主力艦の保有量を制限した条約は？|ワシントン海軍軍縮条約|T
義和団戦争後、清と列強の間で結ばれたものは？|北京議定書|T
義和団戦争 → ロシアはどこへの進出を強めた？|満州||山東半島,朝鮮半島`.trim().split("\n").map((l,n)=>{const[q,a,t,x]=l.split("|");return{n,q,a,t,x}});
const $=s=>document.querySelector(s),app=$("#app"),P={};
D.forEach(d=>{if(d.t)(P[d.t]=P[d.t]||[]).push(d.a)});
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let bad=new Set,Q=[],i=0,sc=0,st=0,wr=[],tm,tl,snd=1,ac;
try{bad=new Set(JSON.parse(localStorage.getItem("rk")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("rk",JSON.stringify([...bad]))}catch(e){}};
function beep(ok){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();(ok?[880,1320]:[200,150]).forEach((v,k)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+k*.15;o.type=ok?"sine":"sawtooth";o.frequency.value=v;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.25)})}catch(e){}}
function home(){app.innerHTML=`<h1>歴史総合<br>3択クイズ</h1><p class="sub">～ネプリーグ風・中間考査対策～</p>
<button class="btn" onclick="go(D)">全問チャレンジ（${D.length}問）</button>
<button class="btn s" onclick="go(sh(D).slice(0,10))">10問チャレンジ</button>
${bad.size?`<button class="btn s" onclick="go(D.filter(d=>bad.has(d.n)))">間違えた問題だけ（${bad.size}問）</button>`:""}
<button class="btn s" onclick="snd=!snd;this.textContent=snd?'🔊 サウンド ON':'🔇 サウンド OFF'">${snd?"🔊 サウンド ON":"🔇 サウンド OFF"}</button>`}
function mk(d){const x=d.x?d.x.split(","):sh([...new Set(P[d.t])].filter(v=>v!==d.a)).slice(0,2);return{...d,c:sh([d.a,...x])}}
function go(L){Q=sh(L).map(mk);i=0;sc=0;st=0;wr=[];show()}
function show(){if(i>=Q.length)return end();const q=Q[i];
app.innerHTML=`<div class="top"><span>Q${i+1} / ${Q.length}</span><span>🔥${st}連続</span><span>⭕${sc}</span></div>
<div class="q">${q.q}</div>
${q.c.map((v,k)=>`<button class="c c${k}" onclick="ans(${k})"><b>${"ABC"[k]}</b>${v}</button>`).join("")}
<div id="fb"></div>`;
}
function ans(k){clearInterval(tm);const q=Q[i],ok=q.c[k]===q.a;
document.querySelectorAll(".c").forEach((b,j)=>{b.disabled=true;if(q.c[j]===q.a)b.classList.add("ok");else if(j===k)b.classList.add("ng")});
if(ok){sc++;st++;bad.delete(q.n)}else{st=0;wr.push(q);bad.add(q.n)}
save();beep(ok);
$("#fb").innerHTML=`<div class="res">${ok?"⭕ 正解！":k<0?"⏰ 時間切れ…":"❌ 不正解…"}</div>`+(ok?"":`<p>正解：<b>${q.a}</b></p><button class="btn" onclick="nx()">次へ</button>`);
if(ok)setTimeout(nx,1000)}
function nx(){i++;show()}
function end(){const n=Q.length,r=sc/n,t=r==1?"🏆 全問正解！歴史マスター！":r>=.8?"🎉 すばらしい！":r>=.6?"👍 あと一歩！":"💪 復習あるのみ！";
app.innerHTML=`<h1>結果発表</h1><div class="res" style="font-size:42px">${sc} / ${n}</div><div class="res">${t}</div>
${wr.length?`<button class="btn" onclick="go(wr)">間違えた${wr.length}問だけやり直す</button><h3>間違えた問題</h3><ul>${wr.map(q=>`<li>${q.q}<br>→ <b>${q.a}</b></li>`).join("")}</ul>`:""}
<button class="btn s" onclick="home()">トップへ</button>`}
home();
</script></body></html>
